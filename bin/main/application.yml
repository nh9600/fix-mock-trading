server:
  port: 8080

fix:
  mock-exchange:
    # Mock 거래소(TCP FIX 서버)가 열어두는 포트.
    # 실제 서비스라면 서버와 클라이언트가 서로 다른 프로세스/서버에 있겠지만,
    # 이 학습용 예제는 하나의 Spring Boot 프로세스 안에서 "서버 역할 스레드"와
    # "클라이언트 역할 REST API"를 함께 띄워서 실행 편의성을 높였다.
    port: 9878
  client:
    host: localhost

spring:
  datasource:
    # allowPublicKeyRetrieval/useSSL 옵션은 MySQL 8 기본 인증 방식(caching_sha2_password) 때문에 필요하다.
    url: jdbc:mysql://localhost:3306/dev?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: 
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # 테이블은 db/schema.sql로 직접 만들었으므로 Hibernate가 스키마를 건드리지 않게 한다.
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
