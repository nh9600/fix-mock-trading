plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '1.0.0'
description = '학습용 Mock 주식 매매 시스템 - FIX 프로토콜 메시지를 TCP Socket 위에서 직접 구현한 예제. ' +
        '실제 증권사/거래소 연동이 아니며, QuickFIX/J 등 상용 FIX 엔진을 사용하지 않습니다.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

compileJava {
    options.encoding = 'UTF-8'
    // @PathVariable/@RequestParam이 파라미터 이름을 리플렉션으로 읽어올 수 있게 한다.
    // (이 옵션이 없으면 IDE에 따라 "Name for argument ... not specified" 에러가 날 수 있다.)
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.awaitility:awaitility:4.2.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
